name: Fetch Garmin Actuals and Deploy to GH Pages

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch:
  # Also deploy on push to main when app code changes
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/**'

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Tests
        run: uv run pytest

      - name: Fetch Actuals from Garmin
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: uv run scripts/fetch_actuals.py

      - name: Regenerate Documentation & Build Site
        run: |
          uv run scripts/generate_plan_md.py
          uv run scripts/generate_fridge_sheets.py
          uv run python scripts/build_static.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Add data files
          git add data/actuals.json data/context.json
          git add actuals.json context.json plan.json
          # Add documentation
          git add context.md marathon_plan.md fridge/*.md
          # Add static site artifacts
          git add index.html static/
          
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update: Actuals fetch & site rebuild" && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: fetch-and-deploy
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
