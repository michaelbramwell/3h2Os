name: Update Weight

on:
  workflow_dispatch:
    inputs:
      weight:
        description: 'Current Weight in kg (e.g., 95.5)'
        required: true
        type: string

jobs:
  update-weight:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Tests
        run: uv run pytest

      - name: Run Update Weight Script
        run: |
          uv run scripts/update_weight.py "${{ inputs.weight }}"

      - name: Rebuild Static Site
        run: uv run scripts/build_static.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add potentially changed files
          git add data/context.json
          git add marathon_plan.md context.md
          git add index.html static/
          
          # Check for changes and commit
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update weight: ${{ inputs.weight }}kg" && git push)

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy-pages:
    needs: update-weight
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
