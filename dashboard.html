<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marathon Training Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
        }
        .markdown-body th, .markdown-body td {
            border: 1px solid #e2e8f0;
            padding: 0.75rem;
            text-align: left;
        }
        .markdown-body th {
            background-color: #f8fafc;
            font-weight: 600;
        }
        .current-week {
            background-color: #fef3c7 !important;
            border: 2px solid #f59e0b !important;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="mb-8 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-slate-900">Bunbury Marathon 2026</h1>
                <p class="text-slate-600">Training Dashboard & Progress Tracker</p>
            </div>
            <div id="current-date" class="text-right text-sm font-medium text-slate-500"></div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <!-- Sidebar / Stats -->
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-4">Goal</h2>
                    <p class="text-2xl font-bold text-slate-900">Sub-4 Hours</p>
                    <p class="text-sm text-slate-500 mt-1">Bunbury • April 12, 2026</p>
                </div>
                
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-4">Weight Tracker</h2>
                    <div class="flex items-end gap-2">
                        <p class="text-2xl font-bold text-slate-900">97kg</p>
                        <p class="text-sm text-slate-500 mb-1">/ 90kg target</p>
                    </div>
                    <div class="w-full bg-slate-100 h-2 rounded-full mt-3">
                        <div class="bg-blue-500 h-2 rounded-full" style="width: 30%"></div>
                    </div>
                </div>

                <div id="context-area" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 prose prose-sm max-w-none">
                    <!-- Context will be loaded here -->
                    Loading context...
                </div>
            </div>

            <!-- Main Plan Table -->
            <div class="lg:col-span-3">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 overflow-x-auto">
                    <div id="plan-content" class="markdown-body">
                        Loading training plan...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Set current date
        const now = new Date();
        document.getElementById('current-date').innerText = now.toLocaleDateString('en-AU', { 
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
        });

        async function loadDashboard() {
            try {
                // Load Plan
                const planResponse = await fetch('marathon_plan.md');
                const planMd = await planResponse.text();
                document.getElementById('plan-content').innerHTML = marked.parse(planMd);

                // Load Context
                const contextResponse = await fetch('context.md');
                const contextMd = await contextResponse.text();
                document.getElementById('context-area').innerHTML = marked.parse(contextMd);

                highlightCurrentWeek();
            } catch (error) {
                console.error('Error loading dashboard:', error);
            }
        }

        function highlightCurrentWeek() {
            const rows = document.querySelectorAll('table tr');
            const today = new Date();
            
            rows.forEach((row, index) => {
                if (index === 0) return; // Skip header
                
                const dateCell = row.cells[0];
                if (!dateCell) return;

                const dateStr = dateCell.innerText.trim();
                // Parse "Jan 5" format (assuming 2026 for Jan-Apr, 2025 for Dec)
                const monthMap = { 'Jan': 0, 'Feb': 1, 'Mar': 2, 'Apr': 3, 'Dec': 11 };
                const parts = dateStr.split(' ');
                if (parts.length < 2) return;

                const month = monthMap[parts[0]];
                const day = parseInt(parts[1]);
                const year = (month === 11) ? 2025 : 2026;
                
                const weekStart = new Date(year, month, day);
                const weekEnd = new Date(weekStart);
                weekEnd.setDate(weekStart.getDate() + 7);

                if (today >= weekStart && today < weekEnd) {
                    row.classList.add('current-week');
                    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            });
        }

        loadDashboard();
    </script>
</body>
</html>
