<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="waveGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563EB" /> <!-- Royal Blue -->
      <stop offset="100%" style="stop-color:#22D3EE" /> <!-- Cyan -->
    </linearGradient>
  </defs>
  
  <!-- The 3 Waves: Symbolizing 3h2Os (Water/Speed) -->
  <path d="M15 75 C 40 45, 60 95, 90 65" stroke="url(#waveGradient)" stroke-width="12" stroke-linecap="round" fill="none" />
  <path d="M15 55 C 40 25, 60 75, 90 45" stroke="url(#waveGradient)" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.85" />
  <path d="M15 35 C 40 5, 60 55, 90 25" stroke="url(#waveGradient)" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.7" />
</svg>