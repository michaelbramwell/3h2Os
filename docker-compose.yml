services:
  web:
    build: ./backend
    container_name: running_app
    ports:
      - "8000:8000"
    volumes:
      # Persist the data directory (database, logs, etc.)
      - ./backend/data:/app/data
      # Mount local source for development
      - ./backend/app:/app/app:ro
      - ./backend/scripts:/app/scripts:ro
      - ./backend/db:/app/db:ro
      - ./backend/tests:/app/tests:ro
    env_file:
      - .env
    environment:
      # Use psycopg 3 explicitly (postgresql+psycopg://) instead of default (postgresql:// -> psycopg2)
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-running_db}
      - SQLITE_DB_PATH=data/database.db
      - JWT_VERIFY_SIGNATURE=true
      - CORS_ORIGINS=http://localhost:5173,http://localhost:8000
      # IDP_URL should point to keycloak service inside docker network for backend
      - IDP_URL=http://keycloak:8080
      # Mark this compose stack as development so dev-only fallbacks
      # (DEFAULT_USERNAME, TrustedHostMiddleware allowlist, Strava webhook
      # secrets not required) are active. Production uses
      # docker-compose.prod.yml with ENVIRONMENT=production.
      - ENVIRONMENT=development
    # Migrations run automatically via app lifespan on startup
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:15-alpine
    container_name: running_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-running_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init_keycloak.sql:/docker-entrypoint-initdb.d/init_keycloak.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: running_idp
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-user}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
      KC_HOSTNAME: localhost
    command: start-dev --import-realm
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default

  frontend:
    build: ./frontend
    container_name: running_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Prevent host node_modules from overwriting container's
    environment:
      - CHOKIDAR_USEPOLLING=true # Better file watching for Docker on some systems
      - VITE_AUTH_AUTHORITY=http://localhost:8080/realms/running-realm
      - VITE_AUTH_CLIENT_ID=running-app
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - web
    networks:
      - default

volumes:
  postgres_data:

networks:
  default:
    driver: bridge


  # Optional: Scheduler/Worker service if you want to run syncs automatically in docker
  # worker:
  #   build: .
  #   container_name: running_worker
  #   command: watchmedo ... (or a custom cron script)
  #   volumes:
  #     - ./data:/app/data
  #   env_file:
  #     - .env
